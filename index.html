<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: comic sans ms;
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background-color: #0B192C;
            padding: 20px;
            text-align: center;
            color: white;
        }

        nav {
            background-color: #006847;
            padding: 12px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        article {
            max-width: 400px;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #0B192C;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit { background-color: #006847; color: white; }
        .reset { background-color: #e0e0e0; }

        footer {
            background-color: #0B192C;
            padding: 15px;
            text-align: center;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tienda</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Ofertas</a></li>
            <li><a href="#">Cuenta</a></li>
        </ul>
    </nav>

    <main>
        <article>
            <h2>Tienda online</h2>
            <form action="" method="post">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" required>

                <label for="producto">Producto:</label>
                <select id="producto" name="producto">
                    <option>Producto 1</option>
                    <option>Producto 2</option>
                </select>

                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" value="1" min="1">

                <div class="btn-group">
                    <input type="submit" value="Comprar" class="btn submit">
                    <input type="reset" value="Borrar" class="btn reset">
                </div>
            </form>
        </article>
    </main>

    <footer>
        <p>Daniel Vazquez Montañez | 5ºI | 24308051280673</p>
    </footer>

</body>
</html>

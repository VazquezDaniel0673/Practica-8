<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background-color: #0B192C;
            padding: 20px;
            text-align: center;
            color: white;
        }

        nav {
            background-color: #006847;
            padding: 12px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        article {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #0B192C;
        }

        /* Contenedor horizontal para las imágenes */
        .galeria-imagenes {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            cursor: pointer;
        }

        footer {
            background-color: #0B192C;
            padding: 15px;
            text-align: center;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tienda de Daniel69</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="#">Ofertas</a></li>
            <li><a href="cuenta.html">Cuenta</a></li>
        </ul>
    </nav>

    <main>
        <article>
            <h2>Tienda online</h2>

            <!-- Agrupamos las imágenes en un div con flexbox -->
            <div class="galeria-imagenes">
                <img src="belleza1.jpg" alt="Productos de belleza" style="width: 150px; height: auto">
                <img src="cocina1.jpg" alt="Productos de cocina" style="width: 150px; height: auto">
                <img src="juguetes1.jpg" alt="Jugueteria" style="width: 150px; height: auto">
                <img src="pc1.jpg" alt="Tienda de electronica" style="width: 200px; height: auto">
                <img src="ropa1.jpg" alt="Moda" style="width: 200px; height: auto">
            </div>

            <form action="" method="post">
                <label for="usuario">Usuario: </label>
                <input type="text" id="usuario" name="usuario" required>

                <label for="producto">Producto: </label>
                <select id="producto" name="producto">
                    <option>Productos de BELLEZA</option>
                    <option>Productos de COCINA</option>
                    <option>Jugueteria</option>
                    <option>Productos ELECTRONICOS</option>
                    <option>ROPA y MODA</option>
                </select>

                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" value="1" min="1">

                <div class="btn-group">
                    <input type="submit" value="Comprar" class="btn submit">
                    <input type="reset" value="Borrar" class="btn reset">
                </div>
            </form>
        </article>
    </main>

    <footer>
        <p>Daniel Vazquez Montañez | 5ºI | 24308051280673</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background-color: #0B192C;
            padding: 20px;
            text-align: center;
            color: white;
        }

        nav {
            background-color: #006847;
            padding: 12px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        article {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #0B192C;
        }

        /* Contenedor horizontal para las imágenes */
        .galeria-imagenes {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            cursor: pointer;
        }

        footer {
            background-color: #0B192C;
            padding: 15px;
            text-align: center;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tienda de Daniel69</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="#">Ofertas</a></li>
            <li><a href="cuenta.html">Cuenta</a></li>
        </ul>
    </nav>

    <main>
        <article>
            <h2>Cuenta</h2>
                <form action="" method="post">
                Ingresa tu correo electronico:
                <input type="email" name="correo electronico">
                Ingresa tu usuario:
                <input type="text" name="usuario">
                Ingresa tu contraseña:
                <input type="password" name="pass">
                Confirma tu contraseña:
                <input type="password" name="pass">

        
                <br> 
        
                <input type="submit" value="enviar">
        
                <input type="reset" value="borrar">

                 </form>
        </article>
    </main>

    <footer>
        <p>Daniel Vazquez Montañez | 5ºI | 24308051280673</p>
    </footer>

</body>
</html>
